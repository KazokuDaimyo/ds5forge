name: Release

# Builds the Windows installer and attaches it to a draft GitHub release.
# Trigger: push a tag such as v0.1.0 (the version must match src-tauri/tauri.conf.json).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DS5Forge ${{ github.ref_name }}"
          releaseBody: "Windows installer. See the README for the optional drivers (ViGEmBus, HidHide)."
          releaseDraft: true
          prerelease: false
